# 코드가 직접 검사하는 수치 기준. 각 값의 출처를 주석으로 남긴다.
# 문서가 서로 다르면 최신(2026 ver. 총무OT.pdf)을 우선하고, 2026에 없는 값만 2023 매뉴얼을 쓴다.
limits:
  meal_per_person: 12000          # 2026: 식대 1인당 12,000원 이내 (운영비/출장비). 사업·회의 식사는 상집 식대 준용(2023 표현) -> 준용 적용은 해석임
  snack_per_person: 5000          # 2026: 다과비 1인당 5,000원 기준
  after_party_per_person: 20000   # 2023 매뉴얼 표(회의비)만 명시. 2026 매뉴얼에는 금액 없음 -> 확인 필요
  lodging_per_night: 100000       # 2026: 2인 1실 1박 기준, 1인 초과 시 20,000원 추가
  lodging_extra_per_person: 20000
  air_cap_event_support: 200000   # 2026: 각종 사업회의 항공료 20만원 한도 내 실비
  claim_deadline_months: 3        # 2023 실무: 지출일 기준 최대 3개월 이내 청구
fuel:
  divisor: {gasoline: 10, diesel: 8, lpg: 6}   # (주행거리*주유단가)/divisor. 전기차는 영수증 전액
  # 샘플마다 절사 단위가 달라 확정할 수 없다(1원/10원/1,000원 혼재). 260730 샘플은 10원 단위 절사와 일치.
  round_unit: 10
  round_mode: floor
