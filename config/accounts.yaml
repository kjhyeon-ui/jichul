# 목(계정과목) 기준. 출처 표기: [26]=총무OT.pdf(2026 ver.), [23]=회계인사총무_업무처리매뉴얼.pdf(2023, 4~6쪽 예산표 포함)
# 문서에는 숫자 계정코드가 없고 '목' 이름만 있다. 엔파스(NPAS) 계정코드가 따로 있으면 code 필드에 추가하면 된다.
accounts:
  - name: 출장비
    use_when: >
      상집(본부 상근 간부)의 출장 교통비·식대·숙박비. 운영위 참석도 회의비가 아니라 출장비로 청구[26].
      출장 중 상집 본인 점심은 출장비, 상집이 아닌 사람과의 식사는 출장비·식대에 넣을 수 없고 사업비로 분리[23].
    evidence: [영수증, 자차 시 이동거리 지도 캡처(왕복 km)와 오피넷 당일 단가, 톨게이트 영수증(하이패스는 카드내역)]
    notes: >
      KTX 기준(없으면 고속버스)[26]. 특실은 일반실 만석 증빙[26]. 택시는 물품이동·대중교통 곤란·귀가 23시 이후만 실비[26].
      숙박 2인1실 1박 100,000원, 1인 초과 20,000원 추가(수련회·농성장·주거지 출장 제외)[26].
      아침식사는 열차·항공 8시 이전 출발 또는 현지 숙박 후 다음날[26]. 항공은 제주·KTX 매진(증빙)·긴급 사유일 때[26].
  - name: 회의비
    use_when: >
      민주노총·공공운수노조 대의원회·중앙위원회, 의료연대본부 대의원회·운영위원회·임원회의·징계위원회에
      상집이 아닌 참석자의 왕복 교통비·식대[26]. 상집 간부 본인의 교통비·식대는 출장비[26].
    evidence: [영수증, 회의결과(결과 위치 근거 표시)]
    notes: >
      교통비는 해당지역 KTX·고속버스, 제주는 항공 기준. 주차료 불포함(상집 물품이동·공식 자차는 청구 가능)[26].
      뒤풀이 1인 2만원은 2023 매뉴얼에만 명시[23].
  - name: 조직사업비
    use_when: >
      조직사업 시 회의비·간식비·대관료·사업비, 본부 산하 조직의 경조사[23]. 국립대·사립대·의료원·간병 대표자회의,
      공공기관사업본부 대표자회의, 사무국장단회의는 조직사업비, 회의성원 1인 지원[26].
    evidence: [영수증, 회의결과, 사업계획서·운영위 승인(조직사업 지원 시)]
    notes: 조직사업 지원은 사업계획서 제출 후 운영위 사전 승인, 집행 결산액의 50% 지원[26]. 사업 참여 시 교통비 및 1식 지원, 항공료는 20만원 한도 실비[26].
  - name: 전략사업비
    use_when: 사업계획에 따른 지역지부·미조직 조직확대 사업. 조직담당자회의는 전략사업비(회의성원 1인 지원)[26].
    evidence: [영수증, 운영위 승인 자료]
    notes: 2026년 한정 기조직·미조직 조직확대 사업 지부/분회 50% 지원[26].
  - name: 정책사업비
    use_when: 정책사업 시 회의비·간식비·대관료·사업비[23], 정책위원회·간호노동포럼(분회당 최대 2인)[26]. 자문회의비 1회 10만원[26]. 자문위원과의 식사[23]. 국립대연대체/실무회의는 지원 없음[26].
    evidence: [영수증, 회의결과]
  - name: 교육사업비
    use_when: 교육사업 시 회의비·간식비·대관료·강사료·책 구매[23]. 교육위원회·본부 소집 교육·학습소모임(분회당 최대 2인)[26].
    evidence: [영수증, 교육사업계획서, 교육 안내 웹자보]
    notes: 외부강사료 서울 시간당 15만원, 지역 20만원[26]. 취약조직 교육비 50만원 연 1회[26].
  - name: 선전사업비
    use_when: 본부 선전, 본부가 지원 결의한 지부/분회 선전[26].
    evidence: [영수증, 제작물(피켓·현수막 등) 시안, 대량주문·계약 시 계약서/견적서]
  - name: 연대사업비
    use_when: 투쟁사업장·연대단위 지원, 분담금, 정기후원(회비), 연대 행사 참가 비용, 본부 산하 외 조직 경조사[26][23].
    evidence: [지급증(현금 지출), 후원 결정 논의결과·웹자보]
  - name: 투쟁사업비
    use_when: 본부 주최 결의대회, 민주노총·노조 집회 등 지침에 따른 집회 참석 지원(교통비·식대·뒷풀이)[26].
    evidence: [참가자 서명부, 버스 영수증(원본), 제주는 항공 영수증·티켓]
    notes: 서울 1식, 지역 2식[26]. 노조 청구와 이중청구 주의[26].
  - name: 총무사업비
    use_when: 우편·배송비, 명함·명찰, AS, 줌·엔파스 사용료, 회계감사 관련, 조끼(개당 22,500원)[26]. 사무처 환영회·환송회[26].
    evidence: [영수증]
  - name: 법률사업비
    use_when: 법률지원비로 매월 지급되는 비용[26].
  - name: 식대
    use_when: 본부 상집의 식사(야근·주말출근). 본부 간부 외의 사람과 식사하는 경우는 해당하지 않음[23].
    evidence: [영수증, "야근 사유와 야근 시 업무 구체 기재 [23]"]
    notes: 1인 12,000원 이내[26].
  - name: 소모품비
    use_when: 정기적으로 교체가 필요한 소모성 물품(마우스·키보드·멀티탭·건전지·인쇄용지·사무용품)[26][23].
  - name: 잡비
    use_when: 생활에 필요한 1회성 물품(커피·식사용품·생수·청소용품·물티슈·휴지 등)[26][23].
  - name: 기구비품비
    use_when: 반영구적으로 쓰는 기구·비품(컴퓨터·가구·가전·전자제품)[26].
    evidence: [영수증, "제품설명자료 [23]"]
  - name: 신문도서비
    use_when: 매일노동뉴스·한겨레·경향 등 구독 외 도서 구입비[26].
  - name: 경조비
    use_when: 본부장 명의. 경사 현금 10만원, 애사 현금 10만원(+본부장 판단 시 조화)[26]. 상집 경조사는 본부장 명의[23].
    evidence: [지급증 또는 부고알림]
  - name: 복리후생비
    use_when: 상근자만 해당. 건강검진비(38만원), 자기계발비 월 3만원[26].
    notes: 도서는 결제한 해당 월만 인정, 영화·공연은 본인 1인만, 교육·학원은 기간 명시[26].
  - name: 사무실관리비
    use_when: 사무실 관리비, 복사기 임대료, 인터넷사용료, 가스요금, 홈페이지 서버 사용료[23]. 월 95만원 편성[26].
  - name: 통신비
    use_when: 본부 전임자 월 7만원[26].
  - name: 직무활동비
    use_when: 임원 등 정액 지급(본부장 40만, 수석부본부장 30만, 사무국장 10만, 부본부장 7만)[26].

# 사업/회의 유형별 기본 목과 지원 범위 ([26] 사업비 표, 2025.04 운영위 결과)
